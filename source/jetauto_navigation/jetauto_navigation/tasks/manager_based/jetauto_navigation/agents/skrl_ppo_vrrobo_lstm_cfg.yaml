seed: 42

models:
  separate: True
  policy:
    class: LSTMGaussianPolicy
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    encoder_layers: [512]
    rnn_hidden_size: 256
    rnn_num_layers: 1
    sequence_length: 4
    head_layers: [256, 128]
    activation: elu
  value:
    class: LSTMDeterministicValue
    clip_actions: False
    encoder_layers: [512]
    rnn_hidden_size: 256
    rnn_num_layers: 1
    sequence_length: 4
    head_layers: [256, 128]
    activation: elu

memory:
  class: RandomMemory
  memory_size: -1

agent:
  class: PPO_RNN
  rollouts: 40
  learning_epochs: 5
  mini_batches: 2
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 3.0e-04
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.008
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True
  entropy_loss_scale: 0.0
  value_loss_scale: 2.0
  kl_threshold: 0.0
  rewards_shaper_scale: 0.1
  time_limit_bootstrap: False
  experiment:
    directory: "jetauto_vrrobo_manager"
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: auto

trainer:
  class: SequentialTrainer
  timesteps: 160000
  environment_info: log
