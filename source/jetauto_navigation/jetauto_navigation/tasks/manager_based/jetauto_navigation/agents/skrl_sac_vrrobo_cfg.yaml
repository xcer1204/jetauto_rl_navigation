seed: 42

models:
  separate: True
  policy:
    class: GaussianMixin
    clip_actions: True
    clip_log_std: True
    min_log_std: -5.0
    max_log_std: 2.0
    initial_log_std: -1.0
    network:
      - name: net
        input: STATES
        layers: [512, 256, 128]
        activations: elu
    output: tanh(ACTIONS)
  critic_1:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES_ACTIONS
        layers: [512, 256, 128]
        activations: elu
    output: ONE
  critic_2:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES_ACTIONS
        layers: [512, 256, 128]
        activations: elu
    output: ONE
  target_critic_1:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES_ACTIONS
        layers: [512, 256, 128]
        activations: elu
    output: ONE
  target_critic_2:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES_ACTIONS
        layers: [512, 256, 128]
        activations: elu
    output: ONE

memory:
  class: RandomMemory
  memory_size: 100000

agent:
  class: SAC
  gradient_steps: 1
  batch_size: 128
  discount_factor: 0.99
  polyak: 0.005
  actor_learning_rate: 1.0e-04
  critic_learning_rate: 1.0e-04
  learning_rate_scheduler: null
  learning_rate_scheduler_kwargs: null
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  random_timesteps: 512
  learning_starts: 512
  grad_norm_clip: 1.0
  learn_entropy: True
  entropy_learning_rate: 1.0e-04
  initial_entropy_value: 0.2
  target_entropy: null
  rewards_shaper_scale: 0.1
  mixed_precision: False
  experiment:
    directory: "jetauto_vrrobo_manager"
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: auto

trainer:
  class: SequentialTrainer
  timesteps: 40000
  environment_info: log
